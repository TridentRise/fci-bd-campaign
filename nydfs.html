const b2a=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function getKey(pw){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
return crypto.subtle.deriveKey({name:"PBKDF2",salt:b2a(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);}
async function tryKey(key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(NONCE)},key,b2a(DATA));
const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
const go=()=>setTimeout(()=>{document.open();document.write(html);document.close();},0);
if(document.readyState==="complete")go();else window.addEventListener("load",go,{once:true});}
async function unlock(pw){try{const key=await getKey(pw);const raw=await crypto.subtle.exportKey("raw",key);
localStorage.setItem("fci_k",btoa(String.fromCharCode(...new Uint8Array(raw))));await tryKey(key);
}catch(e){document.getElementById("err").style.display="block";}}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();unlock(document.getElementById("pw").value);});
(async()=>{const s=localStorage.getItem("fci_k");if(s){try{const key=await crypto.subtle.importKey("raw",b2a(s),{name:"AES-GCM"},false,["decrypt"]);await tryKey(key);}catch(e){localStorage.removeItem("fci_k");}}})();
</script></body></html>
